[package]
name = "comb-speed"
version = "0.1.0"
edition = "2024"
publish = false
description = "End-to-end treetci timing on a comb tree with a unit-dimension junction (public API only)"

# Its own workspace and pin: the observer API it uses is newer than the parent crate's pin.
[workspace]

[dependencies]
tensor4all-treetci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "74e00ad28ac9033822cad328e0484947eee18683" }
anyhow = "1"

# To time a patched checkout (e.g. a PR branch), uncomment and point at it; keep every crate
# listed so that only one copy of each is built.
# [patch."https://github.com/tensor4all/tensor4all-rs"]
# tensor4all-core = { path = "../../tensor4all-rs/crates/tensor4all-core" }
# tensor4all-treetn = { path = "../../tensor4all-rs/crates/tensor4all-treetn" }
# tensor4all-treetci = { path = "../../tensor4all-rs/crates/tensor4all-treetci" }
# tensor4all-tensorbackend = { path = "../../tensor4all-rs/crates/tensor4all-tensorbackend" }

[profile.release]
debug = "line-tables-only"
